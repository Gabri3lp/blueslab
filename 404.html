<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=0.85, maximum-scale=5.0, user-scalable=yes" />
    <title>Blues Lab - Pokémon Masters EX Calculator & Sync Grid</title>
    <base href="/blueslab/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" href="_framework/blazor.webassembly.js" as="script" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" /></noscript>
    <link rel="stylesheet" href="css/app.css" />
    <script src="js/dbCache.js?v=3"></script>
</head>

<body style="background-color: #121820;" class="text-light">
    <div id="app"></div>

    <div id="blazor-error-ui" class="bg-danger text-white p-3 fixed-bottom d-none">
        An unhandled error has occurred.
        <a href="." class="reload text-warning ms-2">Reload</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="js/gridTooltip.js" defer></script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js').catch(function(e) {
                console.warn('[BluesLab] ServiceWorker registration failed:', e);
            });
        }
    </script>
</body>

</html>
