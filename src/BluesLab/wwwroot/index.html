<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=0.85, maximum-scale=5.0, user-scalable=yes" />
    <title>Blues Lab - Pokémon Masters EX Calculator & Sync Grid</title>
    <base href="/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <script src="js/dbCache.js?v=3"></script>
</head>

<body class="bg-dark text-light">
    <div id="app">
        <div class="d-flex flex-column vh-100 overflow-hidden bg-dark text-light">
            <!-- Top Loading Progress Bar -->
            <div class="progress" style="height: 3px; border-radius: 0; background-color: #212529;">
                <div class="progress-bar progress-bar-striped progress-bar-animated bg-warning w-100" role="progressbar"></div>
            </div>

            <!-- Top HeaderNav Skeleton -->
            <div class="d-flex align-items-center justify-content-between px-3 py-2 border-bottom border-secondary bg-dark shadow-sm">
                <div class="d-flex align-items-center gap-3">
                    <span class="fw-bolder text-warning d-flex align-items-center gap-2 mb-0 fs-6">
                        <i class="bi bi-cpu-fill"></i> BLUES LAB
                    </span>
                    <div class="placeholder-glow d-flex align-items-center gap-2">
                        <span class="placeholder bg-secondary rounded py-2" style="width: 120px; height: 30px;"></span>
                    </div>
                </div>
                <div class="d-flex align-items-center gap-2 text-warning small">
                    <div class="spinner-border spinner-border-sm text-warning" role="status"></div>
                    <span class="text-secondary small d-none d-sm-inline">Loading Engine...</span>
                </div>
            </div>

            <!-- Split View Layout Skeleton -->
            <div class="d-flex flex-column flex-lg-row flex-grow-1 overflow-hidden">
                <!-- Left Hex Grid Pane -->
                <div class="col-lg-6 d-flex flex-column border-end border-secondary bg-black bg-opacity-25 overflow-hidden">
                    <div class="d-flex align-items-center justify-content-between px-3 py-2 border-bottom border-secondary border-opacity-50">
                        <div class="placeholder-glow w-50">
                            <span class="placeholder col-6 bg-secondary rounded py-1"></span>
                        </div>
                    </div>
                    <div class="flex-grow-1 d-flex flex-column align-items-center justify-content-center text-muted py-5">
                        <div class="spinner-border text-warning mb-3" style="width: 2.8rem; height: 2.8rem;" role="status"></div>
                        <div class="fw-bold text-light fs-6">BLUES LAB</div>
                        <div class="text-secondary small mt-1">Initializing PMEX Database...</div>
                    </div>
                </div>

                <!-- Right Details Pane -->
                <div class="col-lg-6 d-flex flex-column overflow-hidden d-none d-lg-flex">
                    <div class="d-flex align-items-center px-3 py-2 border-bottom border-secondary bg-dark gap-2">
                        <span class="btn btn-warning btn-sm fw-bold disabled" style="opacity: 0.9;">Overview</span>
                        <span class="btn btn-outline-secondary btn-sm disabled">Damage</span>
                        <span class="btn btn-outline-secondary btn-sm disabled">3v3 Team</span>
                    </div>
                    <div class="flex-grow-1 p-3 placeholder-glow">
                        <div class="card bg-dark border-secondary p-3 mb-3">
                            <div class="d-flex align-items-center gap-3">
                                <div class="rounded-circle bg-secondary placeholder" style="width: 44px; height: 44px;"></div>
                                <div class="flex-grow-1">
                                    <span class="placeholder col-5 bg-secondary rounded mb-2 d-block"></span>
                                    <span class="placeholder col-3 bg-secondary rounded d-block"></span>
                                </div>
                            </div>
                        </div>
                        <div class="card bg-dark border-secondary p-3">
                            <span class="placeholder col-7 bg-secondary rounded mb-2 d-block"></span>
                            <span class="placeholder col-4 bg-secondary rounded mb-2 d-block"></span>
                            <span class="placeholder col-6 bg-secondary rounded d-block"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui" class="bg-danger text-white p-3 fixed-bottom d-none">
        An unhandled error has occurred.
        <a href="." class="reload text-warning ms-2">Reload</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/gridTooltip.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
