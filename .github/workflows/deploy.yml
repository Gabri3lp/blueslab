name: Deploy Blues Lab to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore src/BluesLab/BluesLab.csproj

      - name: Download avatar images from PMEX CDN
        run: |
          echo "Downloading avatar images from pairs JSON..."
          TRAINERS_DIR="src/BluesLab/wwwroot/img/trainers"
          mkdir -p "$TRAINERS_DIR"

          python3 - <<'EOF'
          import json, os, urllib.request, glob, time

          trainers_dir = "src/BluesLab/wwwroot/img/trainers"
          pairs_dir = "src/BluesLab/wwwroot/data/pairs"

          CDN_BASE = "https://pokemon.brybry.ch"
          headers = {"User-Agent": "Mozilla/5.0"}

          seen = set()
          ok = 0
          fail = 0

          for f in sorted(glob.glob(f"{pairs_dir}/*.json")):
              try:
                  data = json.loads(open(f, encoding="utf-8").read())
                  icon = data.get("iconUrl", "")
                  if not icon:
                      continue
                  filename = icon.split("/")[-1]
                  if filename in seen:
                      continue
                  seen.add(filename)
                  dest = os.path.join(trainers_dir, filename)
                  if os.path.exists(dest):
                      ok += 1
                      continue
                  # Build CDN URL from filename pattern e.g. 0126_00-0006_00.png
                  # -> https://pokemon.brybry.ch/masters/img/trainers/0126_00-0006_00.png
                  url = f"{CDN_BASE}/masters/img/trainers/{filename}"
                  try:
                      req = urllib.request.Request(url, headers=headers)
                      with urllib.request.urlopen(req, timeout=10) as r:
                          open(dest, "wb").write(r.read())
                      ok += 1
                  except Exception as e:
                      fail += 1
                      if fail <= 5:
                          print(f"  FAIL: {filename} -> {e}")
                  time.sleep(0.05)
              except Exception as e:
                  print(f"Error processing {f}: {e}")

          print(f"Done: {ok} downloaded, {fail} failed")
          EOF

          # Ensure fallback unknown.png exists
          if [ ! -f "$TRAINERS_DIR/unknown.png" ]; then
            # Create minimal 1x1 gray PNG as fallback
            python3 -c "
          import base64, os
          # Minimal 1x1 gray PNG
          data = base64.b64decode('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==')
          open('$TRAINERS_DIR/unknown.png','wb').write(data)
          print('Created fallback unknown.png')
          "
          fi

          echo "Avatar images ready: $(ls $TRAINERS_DIR | wc -l) files"

      - name: Publish Blazor WASM
        run: |
          dotnet publish src/BluesLab/BluesLab.csproj \
            -c Release \
            -o publish \
            -p:BlazorEnableCompression=false \
            --nologo

      - name: Fix base href for GitHub Pages sub-path
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          sed -i "s|<base href=\"/\" />|<base href=\"/${REPO_NAME}/\" />|g" publish/wwwroot/index.html
          echo "Base href set to /${REPO_NAME}/"

      - name: Copy index.html -> 404.html (SPA routing fallback)
        run: cp publish/wwwroot/index.html publish/wwwroot/404.html

      - name: Add .nojekyll
        run: touch publish/wwwroot/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4