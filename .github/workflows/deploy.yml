name: Deploy Blues Lab to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore src/BluesLab/BluesLab.csproj

      - name: Download avatar and Pokemon images from CDN
        run: |
          echo "Downloading images from pairs JSON..."
          TRAINERS_DIR="src/BluesLab/wwwroot/img/trainers"
          POKEMON_DIR="src/BluesLab/wwwroot/img/pokemon"
          mkdir -p "$TRAINERS_DIR" "$POKEMON_DIR"

          python3 - <<'EOF'
          import json, os, urllib.request, glob, time

          trainers_dir = "src/BluesLab/wwwroot/img/trainers"
          pokemon_dir = "src/BluesLab/wwwroot/img/pokemon"
          pairs_dir = "src/BluesLab/wwwroot/data/pairs"
          headers = {"User-Agent": "Mozilla/5.0"}

          seen_t = set()
          seen_p = set()
          ok_t, ok_p = 0, 0

          for f in sorted(glob.glob(f"{pairs_dir}/*.json")):
              try:
                  data = json.loads(open(f, encoding="utf-8").read())
                  # Trainer Avatar
                  icon = data.get("iconUrl", "")
                  if icon:
                      fname = icon.split("/")[-1]
                      if fname not in seen_t:
                          seen_t.add(fname)
                          dest = os.path.join(trainers_dir, fname)
                          if not os.path.exists(dest):
                              try:
                                  url = f"https://pokemon.brybry.ch/masters/img/trainers/{fname}"
                                  req = urllib.request.Request(url, headers=headers)
                                  with urllib.request.urlopen(req, timeout=10) as r:
                                      open(dest, "wb").write(r.read())
                                  ok_t += 1
                              except Exception:
                                  pass
                              time.sleep(0.01)

                  # Pokemon Icon
                  pkm_icon = data.get("pokemonIconUrl", "")
                  if pkm_icon:
                      fname_p = pkm_icon.split("/")[-1]
                      if fname_p not in seen_p:
                          seen_p.add(fname_p)
                          dest_p = os.path.join(pokemon_dir, fname_p)
                          if not os.path.exists(dest_p):
                              try:
                                  url = f"https://pomatools.github.io/assets/img/pokemon/{fname_p}"
                                  req = urllib.request.Request(url, headers=headers)
                                  with urllib.request.urlopen(req, timeout=10) as r:
                                      open(dest_p, "wb").write(r.read())
                                  ok_p += 1
                              except Exception:
                                  pass
                              time.sleep(0.01)
              except Exception:
                  pass

          print(f"Downloaded images: {ok_t} trainers, {ok_p} pokemon icons")
          EOF

          # Fallback unknown.png
          if [ ! -f "$TRAINERS_DIR/unknown.png" ]; then
            python3 -c "
          import base64
          data = base64.b64decode('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==')
          open('$TRAINERS_DIR/unknown.png','wb').write(data)
          open('$POKEMON_DIR/unknown.png','wb').write(data)
          "
          fi

      - name: Publish Blazor WASM
        run: |
          dotnet publish src/BluesLab/BluesLab.csproj \
            -c Release \
            -o publish \
            -p:BlazorEnableCompression=false \
            --nologo

      - name: Fix base href for GitHub Pages sub-path
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          sed -i "s|<base href=\"/\" />|<base href=\"/${REPO_NAME}/\" />|g" publish/wwwroot/index.html
          echo "Base href set to /${REPO_NAME}/"

      - name: Copy index.html -> 404.html (SPA routing fallback)
        run: cp publish/wwwroot/index.html publish/wwwroot/404.html

      - name: Add .nojekyll
        run: touch publish/wwwroot/.nojekyll

      - name: Deploy to gh-pages branch (Fallback)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: publish/wwwroot
          branch: gh-pages

      - name: Upload Pages artifact (Native GitHub Actions Pages)
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4